<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Internal Tracking Platform{% endblock %}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f6f7fb;
      }
      header {
        background: #111827;
        color: #fff;
        padding: 18px 24px;
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      header p {
        margin: 6px 0 0;
        opacity: 0.85;
        font-size: 13px;
      }
      .container {
        padding: 18px 24px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 14px;
      }
      .card h3 {
        margin: 0 0 6px;
        font-size: 12px;
        color: #6b7280;
        font-weight: 700;
        text-transform: uppercase;
      }
      .card .value {
        font-size: 22px;
        font-weight: 800;
        color: #111827;
      }
      .row {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      .box-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .badge {
        background: #e0f2fe;
        color: #075985;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #eef2f7;
        text-align: left;
        font-size: 13px;
      }
      th {
        color: #374151;
        font-weight: 700;
      }
      .muted {
        color: #6b7280;
        font-size: 12px;
      }
      .placeholder {
        height: 220px;
        border: 1px dashed #cbd5e1;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
        background: #f8fafc;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Internal Tracking Platform</h1>
      <p>{% block subtitle %}{{ subtitle }}{% endblock %}</p>
    </header>
    <div class="container">{% block content %}{% endblock %}</div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
